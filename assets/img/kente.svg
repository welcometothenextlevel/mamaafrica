  <rect x="0" y="0" width="34" height="14" fill="#a8482a"/>
  <rect x="0" y="3" width="34" height="1" fill="#e2c48b"/>
  <rect x="0" y="10" width="34" height="1" fill="#e2c48b"/>
  <rect x="15" y="5" width="4" height="4" fill="#2a170e" transform="rotate(45 17 7)"/>
  <!-- gold block with woven steps -->
  <rect x="34" y="0" width="22" height="14" fill="#c49a54"/>
  <path d="M34 7h4v-3h4v6h4v-6h4v6h4v-3h2" fill="none" stroke="#2a170e" stroke-width="1.2"/>
  <!-- green block -->
  <rect x="56" y="0" width="26" height="14" fill="#2f4a32"/>
  <rect x="56" y="2" width="26" height="1" fill="#c49a54"/>
  <rect x="56" y="11" width="26" height="1" fill="#c49a54"/>
